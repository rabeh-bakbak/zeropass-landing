<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroPass</title>
    <!-- Tailwind CSS pour un design propre et moderne -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Utilisation de propriétés logiques pour un support RTL natif et fluide */
        body {
            text-align: start;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- Barre de sélection de la langue (en haut) -->
    <header class="max-w-4xl mx-auto p-6 flex justify-end gap-2">
        <button onclick="switchLanguage('fr')" class="px-3 py-1 bg-white border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-100 transition">FR</button>
        <button onclick="switchLanguage('ar')" class="px-3 py-1 bg-white border border-gray-300 rounded-md text-sm font-medium hover:bg-gray-100 transition">العربية</button>
    </header>

    <!-- Section Principale (Hero) -->
    <main class="max-w-4xl mx-auto px-6 py-16 text-center">
        <h1 class="text-4xl font-extrabold tracking-tight sm:text-5xl mb-4" data-i18n="title">
            Bienvenue sur ZeroPass
        </h1>
        <p class="text-lg text-gray-600 max-w-2xl mx-auto mb-8" data-i18n="subtitle">
            Votre solution sécurisée et simplifiée.
        </p>
        <div>
            <a href="#" class="inline-block bg-blue-600 text-white font-medium px-6 py-3 rounded-lg shadow hover:bg-blue-700 transition" data-i18n="cta">
                En savoir plus
            </a>
        </div>
    </main>

    <!-- Script de traduction et gestion du RTL -->
    <script>
        const translations = {
            fr: {
                title: "Bienvenue sur ZeroPass",
                subtitle: "Votre solution sécurisée et simplifiée.",
                cta: "En savoir plus"
            },
            ar: {
                title: "مرحباً بكم في ZeroPass",
                subtitle: "حلك الآمن والمبسط.",
                cta: "إكتشف المزيد"
            }
        };

        function switchLanguage(lang) {
            // 1. Définir la direction (RTL pour l'arabe, LTR pour le français)
            const dir = lang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.setAttribute('lang', lang);
            document.documentElement.setAttribute('dir', dir);

            // 2. Mettre à jour les textes des éléments ciblés
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });

            // 3. Sauvegarder dans le stockage du navigateur
            localStorage.setItem('user_lang', lang);
        }

        // Au chargement de la page, récupérer la dernière langue choisie (optionnel)
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('user_lang');
            if (savedLang && translations[savedLang]) {
                switchLanguage(savedLang);
            }
        });
    </script>
</body>
</html>
